<!--
  =========================================================================================
  Root Application Template (app.html) - Phase 4 Auth Shell
  =========================================================================================
-->
<header class="app-header">
  <div class="header-content">
    <div class="brand">
      <h1 class="app-title">{{ title() }}</h1>
    </div>

    <nav class="app-nav">
      <a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-link">
        Home
      </a>

      @if (authService.isAuthenticated()) {
        <a routerLink="/user" routerLinkActive="active" class="nav-link">
          User
        </a>
        @if (authService.isAdmin()) {
          <a routerLink="/admin" routerLinkActive="active" class="nav-link">
            Admin
          </a>
        }
        <button type="button" class="btn-nav-logout" (click)="logout()">
          Logout ({{ authService.currentUser()?.username }})
        </button>
      } @else {
        <a routerLink="/login" routerLinkActive="active" class="nav-link btn-login-link">
          Sign In
        </a>
      }
    </nav>
  </div>
</header>

<main class="app-main-content">
  <router-outlet />
</main>
