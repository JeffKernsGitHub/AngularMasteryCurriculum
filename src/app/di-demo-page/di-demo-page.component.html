<div class="di-demo-container">
  <div class="page-header">
    <h2>Dependency Injection Scopes Comparison</h2>
    <p class="description">
      Interact with the two independent component instances below. Notice that incrementing the
      <strong>Singleton Service</strong> updates both cards simultaneously, while incrementing the
      <strong>Component-Scoped Service</strong> updates only that specific component.
    </p>
  </div>

  <div class="instances-grid">
    <!-- Component Instance A -->
    <app-di-services [title]="'Component Instance A'" />

    <!-- Component Instance B -->
    <app-di-services [title]="'Component Instance B'" />
  </div>
</div>
