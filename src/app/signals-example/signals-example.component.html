<div class="container">
  <h2>Signals Example</h2>

  <div>
    <h3>Counter</h3>
    <p>Current Count: {{ counter() }}</p>
    <button (click)="increment()">Increment</button>
    <button (click)="decrement()">Decrement</button>
  </div>

  <div>
    <h3>User Information</h3>
    <p>Full Name: {{ fullName() }}</p>
    <input #firstNameInput type="text" placeholder="First Name" (input)="updateName(firstNameInput.value, lastNameInput.value)">
    <input #lastNameInput type="text" placeholder="Last Name" (input)="updateName(firstNameInput.value, lastNameInput.value)">
  </div>

  <div>
    <h3>Service Message</h3>
    <p>{{ signalsExampleService.message() }}</p>
  </div>
</div>
