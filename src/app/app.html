<!--
  =========================================================================================
  Root Application Template (app.html) - Modern Angular 22 Navigation Shell
  =========================================================================================

  Key Elements:
  1. `<header>` & `<nav>`: Semantic containers providing navigation controls.
  2. `routerLink`: Angular Router directive for client-side SPA navigation without page refreshes.
  3. `routerLinkActive="active"`: Automatically binds the `.active` CSS class when matching routes.
  4. `<router-outlet />`: Self-closing outlet element where the active route's lazy-loaded
     component is dynamically rendered.
-->

<header class="app-header">
  <div class="header-content">
    <h1 class="app-title">{{ appTitle }}</h1>
    <nav class="app-nav" aria-label="Main Navigation">
      <!-- 📥 Navigate to Asynchronous Data Loader Feature -->
      <a
        routerLink="/data-loader"
        routerLinkActive="active"
        class="nav-link"
      >
        Data Loader
      </a>

      <!-- 🛠️ Navigate to Signals CRUD Data Manipulator Feature -->
      <a
        routerLink="/data-manipulator"
        routerLinkActive="active"
        class="nav-link"
      >
        Data Manipulator
      </a>
    </nav>
  </div>
</header>

<main class="app-main-content">
  <!--
    🧭 Router Outlet:
    Dynamically hosts the active component determined by the URL matching rule in app.routes.ts.
  -->
  <router-outlet />
</main>
