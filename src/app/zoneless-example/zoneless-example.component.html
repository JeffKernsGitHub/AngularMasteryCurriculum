<div>
  <h2>Zoneless Signal Change Detection with Mock API</h2>
  <p>
    This example demonstrates how Angular's signal-based change detection works
    with a reactive form and mock API calls. Open the console to see the logs from the `computed` and
    `effect` functions.
  </p>
  <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
    <div>
      <label for="firstName">First Name:</label>
      <input
        type="text"
        id="firstName"
        formControlName="firstName"
      />
    </div>
    <div>
      <label for="lastName">Last Name:</label>
      <input
        type="text"
        id="lastName"
        formControlName="lastName"
      />
    </div>
    <button type="submit">Save</button>
  </form>
  <div>
    <p>Full Name: {{ fullName() }}</p>
  </div>
</div>
