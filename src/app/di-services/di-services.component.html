<!--
  =========================================================================================
  DiServicesComponent Template - Demonstrating Singleton vs Scoped Service State
  =========================================================================================
-->
<div class="di-card">
  <div class="card-header">
    <h3>{{ title() }}</h3>
    <span class="scope-tag">Component Injector Demo</span>
  </div>

  <div class="service-panel singleton-panel">
    <div class="service-info">
      <h4>🌐 Singleton Service</h4>
      <p class="service-desc">Provided in <code>'root'</code> — Shared across all components</p>
    </div>
    <div class="service-action">
      <span class="value-badge">{{ singletonService.value() }}</span>
      <button type="button" class="btn btn-primary" (click)="singletonService.increment()">
        Increment Singleton (+1)
      </button>
    </div>
  </div>

  <div class="service-panel scoped-panel">
    <div class="service-info">
      <h4>🔒 Component-Scoped Service</h4>
      <p class="service-desc">Provided in <code>@Component.providers</code> — Isolated to this instance</p>
    </div>
    <div class="service-action">
      <span class="value-badge">{{ componentScopedService.value() }}</span>
      <button type="button" class="btn btn-secondary" (click)="componentScopedService.increment()">
        Increment Scoped (+1)
      </button>
    </div>
  </div>
</div>
