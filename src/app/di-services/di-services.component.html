<div class="demo-box">
  <h3>{{ title }}</h3>

  <h2>Singleton Service</h2>
  <p>Value: {{ singletonService.getValue() }}</p>
  <button (click)="singletonService.increment()">Increment</button>

  <hr>

  <h2>Component-Scoped Service</h2>
  <p>Value: {{ componentScopedService.getValue() }}</p>
  <button (click)="componentScopedService.increment()">Increment</button>
</div>
